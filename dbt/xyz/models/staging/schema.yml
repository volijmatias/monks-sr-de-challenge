version: 2

models:
  - name: stg_ga4_events
    description: "Cleaned GA4 event-level data."
    columns:
      - name: user_id
        tests:
          - not_null
      - name: session_id
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null

  - name: stg_google_ads
    description: "Cleaned Google Ads data at campaign and 6-hour window grain."
    columns:
      - name: campaign_id
        tests:
          - not_null
      - name: batch_window_start
        tests:
          - not_null
      - name: platform
        tests:
          - not_null

  - name: stg_meta_ads
    description: "Cleaned Meta Ads data at campaign and 6-hour window grain."
    columns:
      - name: campaign_id
        tests:
          - not_null
      - name: batch_window_start
        tests:
          - not_null
      - name: platform
        tests:
          - not_null
